<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harshi's Miami Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#0f0b17;
--card:#171122;
--card2:#1d152c;
--text:#f7f0ff;
--muted:#b8abc9;
--pink:#ff69c7;
--blue:#7bc9ff;
--border:rgba(255,255,255,0.08);
--shadow:0 20px 60px rgba(0,0,0,0.45);
}

body{
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left,#26163a 0%,transparent 30%),
radial-gradient(circle at bottom right,#18263f 0%,transparent 30%),
#120f1d;
color:var(--text);
overflow-x:hidden;
}

.hero{
min-height:65vh;
padding:120px 24px 60px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:radial-gradient(circle,var(--pink),transparent 70%);
opacity:.12;
filter:blur(50px);
top:-100px;
left:-100px;
}

.hero h1{
font-family:'Playfair Display',serif;
font-size:clamp(3rem,7vw,6rem);
line-height:1;
margin-bottom:20px;
background:linear-gradient(135deg,#fff,#ff8fda,#7bc9ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
font-size:1.1rem;
color:var(--muted);
max-width:700px;
line-height:1.8;
}

.portal-wrap{
display:flex;
gap:20px;
justify-content:center;
margin-top:40px;
flex-wrap:wrap;
}

.portal-btn{
padding:16px 28px;
border-radius:18px;
border:1px solid var(--border);
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
color:white;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.portal-btn:hover{
transform:translateY(-4px);
background:rgba(255,255,255,0.08);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.topbar{
position:sticky;
top:0;
z-index:999;
background:rgba(15,11,23,0.85);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--border);
padding:16px 24px;
display:flex;
justify-content:space-between;
align-items:center;
}

.topbar h2{
font-size:1rem;
font-weight:800;
letter-spacing:1px;
}

.day-section{
margin-bottom:70px;
}

.day-header{
margin-bottom:28px;
}

.day-label{
font-size:.8rem;
text-transform:uppercase;
letter-spacing:2px;
color:var(--pink);
margin-bottom:8px;
}

.day-title{
font-size:2.5rem;
font-family:'Playfair Display',serif;
}

.trip-card{
background:rgba(255,255,255,0.04);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.06);
border-radius:28px;
padding:24px;
margin-bottom:22px;
box-shadow:0 20px 50px rgba(0,0,0,0.35);
position:relative;
overflow:hidden;
}

.trip-card::before{
content:'';
position:absolute;
inset:0;
background:linear-gradient(135deg,rgba(255,105,199,0.06),transparent,rgba(123,201,255,0.05));
pointer-events:none;
}

.trip-top{
display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:18px;
}

.trip-time{
font-size:.8rem;
letter-spacing:2px;
text-transform:uppercase;
color:var(--pink);
margin-bottom:10px;
}

.trip-card h3{
font-size:1.5rem;
margin-bottom:10px;
}

.trip-location{
color:var(--muted);
font-size:.95rem;
}

.vote-box{
display:flex;
align-items:center;
gap:12px;
background:rgba(255,255,255,0.05);
padding:12px 18px;
border-radius:18px;
height:fit-content;
}

.vote-box button{
background:none;
border:none;
font-size:1rem;
color:white;
cursor:pointer;
}

.budget-row{
display:flex;
gap:18px;
flex-wrap:wrap;
margin:20px 0;
}

.budget-box{
background:rgba(255,255,255,0.04);
border:1px solid var(--border);
padding:16px;
border-radius:18px;
min-width:160px;
}

.budget-box span{
display:block;
font-size:.8rem;
color:var(--muted);
margin-bottom:8px;
}

.budget-box strong{
font-size:1.4rem;
}

.route-visual{
margin-top:14px;
padding:14px;
border-radius:16px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
font-size:.9rem;
color:#d5cbe8;
}

.link-row{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:18px;
}

.link-row a{
text-decoration:none;
background:rgba(255,255,255,0.06);
padding:12px 18px;
border-radius:14px;
color:white;
font-size:.9rem;
transition:.3s;
}

.link-row a:hover{
background:rgba(255,255,255,0.1);
}

.notes-box{
margin-top:18px;
color:var(--muted);
line-height:1.8;
}

.editor-row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:24px;
}

.editor-row button,
.add-btn{
padding:12px 18px;
border-radius:14px;
border:none;
background:linear-gradient(135deg,#ff69c7,#7bc9ff);
color:white;
font-weight:700;
cursor:pointer;
}

.route-line{
height:70px;
width:2px;
background:linear-gradient(to bottom,#ff6ec7,#7dd3fc);
margin:0 auto;
opacity:.5;
}

.secret-card{
border:1px dashed rgba(255,255,255,0.15);
background:rgba(255,255,255,0.03);
padding:24px;
border-radius:24px;
margin-top:20px;
}

.secret-label{
color:#ffd166;
font-size:.85rem;
margin-bottom:10px;
letter-spacing:1px;
text-transform:uppercase;
}

.map-frame{
width:100%;
height:240px;
border:none;
border-radius:20px;
margin-top:18px;
}

@media(max-width:768px){
.trip-top{
flex-direction:column;
}

.hero{
padding-top:100px;
}

.day-title{
font-size:2rem;
}
}
</style>

</head>
<body>

<div class="topbar">
<h2>🌴 HARSHI'S MIAMI BIRTHDAY</h2>
<div>Luxury Miami Weekend</div>
</div>

<section class="hero">
<h1>Miami Birthday Escape</h1>
<p>
4 days of beach clubs, yacht parties, rooftop dinners, sunsets, surprises, and unforgettable memories.
</p>

<div class="portal-wrap">
<button class="portal-btn" onclick="enterBirthdayGirl()">
🎀 Birthday Girl
</button>

<button class="portal-btn" onclick="enterAttendee()">
🎉 Party Attendee
</button>
</div>
</section>

<div class="container" id="main-app"></div>

<script>

const PARTY_PASSWORD='miamivibes';

let attendeeMode=false;

function enterBirthdayGirl(){
attendeeMode=false;
renderAll();
window.scrollTo({top:700,behavior:'smooth'});
}

function enterAttendee(){
const pass=prompt('Enter attendee password');

if(pass===PARTY_PASSWORD){
attendeeMode=true;
renderAll();
window.scrollTo({top:700,behavior:'smooth'});
}else{
alert('Wrong password');
}
}

const activities=[
{
day:'Day 1',
label:'Arrival Day',
title:'Cute Lunch Moment',
time:'12:30 PM',
location:'The Social Club Miami',
maps:'https://maps.google.com/?q=The+Social+Club+Miami',
website:'https://www.thesocialclub.com/',
uber:'https://m.uber.com/',
estimatedBudget:40,
desiredBudget:25,
travelTime:'12 mins from Airbnb',
votes:12,
notes:'Vote if we should replace this brunch idea.',
surprise:false
},
{
day:'Day 1',
label:'Arrival Day',
title:'South Pointe Beach Sunset',
time:'5:30 PM',
location:'South Pointe Park',
maps:'https://maps.google.com/?q=South+Pointe+Park+Miami',
website:'https://www.miamiandbeaches.com/',
uber:'https://m.uber.com/',
estimatedBudget:0,
desiredBudget:0,
travelTime:'8 mins from lunch',
votes:18,
notes:'Golden hour photos + beach content.',
surprise:false
},
{
day:'Day 1',
label:'Secret Surprise',
title:'Luxury Birthday Setup',
time:'8:00 PM',
location:'Private Villa',
maps:'https://maps.google.com/',
website:'#',
uber:'https://m.uber.com/',
estimatedBudget:250,
desiredBudget:180,
travelTime:'15 mins from beach',
votes:42,
notes:'DO NOT SHOW TO HARSHI.',
surprise:true
},
{
day:'Day 2',
label:'Yacht Day',
title:'Private Yacht Party',
time:'1:00 PM',
location:'Miami Marina',
maps:'https://maps.google.com/?q=Miami+Marina',
website:'https://www.getmyboat.com/',
uber:'https://m.uber.com/',
estimatedBudget:120,
desiredBudget:90,
travelTime:'20 mins from Airbnb',
votes:53,
notes:'Matching outfits mandatory.',
surprise:false
},
{
day:'Day 2',
label:'Nightlife',
title:'LIV Nightclub',
time:'11:30 PM',
location:'Fontainebleau Miami Beach',
maps:'https://maps.google.com/?q=LIV+Nightclub+Miami',
website:'https://www.livnightclub.com/',
uber:'https://m.uber.com/',
estimatedBudget:90,
desiredBudget:50,
travelTime:'14 mins from yacht marina',
votes:31,
notes:'Table service possible.',
surprise:false
}
];

function groupedDays(){
const map={};

activities.forEach(item=>{
if(!map[item.day]) map[item.day]=[];
map[item.day].push(item);
});

return map;
}

function renderCard(activity,index,total){

if(activity.surprise && !attendeeMode){
return '';
}

return `
<div class="trip-card">

<div class="trip-top">
<div>
<div class="trip-time">${activity.time}</div>
<h3>${activity.title}</h3>
<div class="trip-location">📍 ${activity.location}</div>
</div>

<div class="vote-box">
<button onclick="upvote(${index})">⬆</button>
<span id="votes-${index}">${activity.votes}</span>
<button onclick="downvote(${index})">⬇</button>
</div>
</div>

<div class="budget-row">
<div class="budget-box">
<span>Estimated Budget</span>
<strong>$${activity.estimatedBudget}</strong>
</div>

<div class="budget-box">
<span>Desired Budget</span>
<strong>$${activity.desiredBudget}</strong>
</div>
</div>

<div class="route-visual">
🚗 Approx Travel Time: ${activity.travelTime}
</div>

<div class="link-row">
<a href="${activity.maps}" target="_blank">📍 Open Maps</a>
<a href="${activity.website}" target="_blank">🌐 Website</a>
<a href="${activity.uber}" target="_blank">🚗 Uber</a>
</div>

<div class="notes-box">
${activity.notes}
</div>

<iframe
class="map-frame"
src="https://www.google.com/maps?q=${encodeURIComponent(activity.location)}&output=embed">
</iframe>

<div class="editor-row">
<button onclick="editActivity(${index})">✏ Edit</button>
<button onclick="deleteActivity(${index})">🗑 Remove</button>
<button onclick="replaceIdea(${index})">🔄 Replace</button>
</div>

</div>

${total-1!==index?'<div class="route-line"></div>':''}
`;
}

function renderAll(){

const app=document.getElementById('main-app');
const grouped=groupedDays();

let html='';

Object.keys(grouped).forEach(day=>{

html+=`
<div class="day-section">

<div class="day-header">
<div class="day-label">Miami Birthday Weekend</div>
<div class="day-title">${day}</div>
</div>
`;

const list=grouped[day];

list.forEach((item,index)=>{
html+=renderCard(item,activities.indexOf(item),list.length);
});

html+=`
<button class="add-btn" onclick="addActivity('${day}')">
+ Add New Activity
</button>
`;

html+='</div>';
});

if(attendeeMode){
html+=`
<div class="secret-card">
<div class="secret-label">Attendee Exclusive</div>
<h2>🎁 Secret Birthday Operations</h2>
<p style="margin-top:12px;color:var(--muted);line-height:1.8;">
This section is hidden from the Birthday Girl view.
You can add surprise setups, secret dinner plans, decoration notes, or private coordination details here.
</p>

<div class="editor-row" style="margin-top:20px;">
<button onclick="addSecret()">+ Add Surprise</button>
</div>
</div>
`;
}

app.innerHTML=html;
}

function upvote(index){
activities[index].votes++;
renderAll();
}

function downvote(index){
activities[index].votes--;
renderAll();
}

function deleteActivity(index){

const confirmDelete=confirm('Delete this activity?');

if(confirmDelete){
activities.splice(index,1);
renderAll();
}
}

function replaceIdea(index){

const replacement=prompt('Replace with what?');

if(replacement){
activities[index].title=replacement;
renderAll();
}
}

function editActivity(index){

const item=activities[index];

const newTitle=prompt('Edit title',item.title);
if(newTitle!==null) item.title=newTitle;

const newLocation=prompt('Edit location',item.location);
if(newLocation!==null) item.location=newLocation;

const newBudget=prompt('Edit estimated budget',item.estimatedBudget);
if(newBudget!==null) item.estimatedBudget=newBudget;

const newDesired=prompt('Edit desired budget',item.desiredBudget);
if(newDesired!==null) item.desiredBudget=newDesired;

const newNotes=prompt('Edit notes',item.notes);
if(newNotes!==null) item.notes=newNotes;

renderAll();
}

function addActivity(day){

const title=prompt('Activity title');
if(!title) return;

const location=prompt('Location');
const budget=prompt('Estimated Budget');

activities.push({
day,
label:'Custom',
title,
time:'TBD',
location:location || 'Unknown',
maps:'https://maps.google.com/',
website:'#',
uber:'https://m.uber.com/',
estimatedBudget:budget || 0,
desiredBudget:budget || 0,
travelTime:'Unknown',
votes:0,
notes:'New custom activity.',
surprise:false
});

renderAll();
}

function addSecret(){

const title=prompt('Secret surprise title');
if(!title) return;

activities.push({
day:'Secret Plans',
label:'Secret',
title,
time:'Secret Time',
location:'Hidden Location',
maps:'https://maps.google.com/',
website:'#',
uber:'https://m.uber.com/',
estimatedBudget:0,
desiredBudget:0,
travelTime:'Hidden',
votes:0,
notes:'Hidden from Birthday Girl.',
surprise:true
});

renderAll();
}

renderAll();

</script>

</body>
</html>
